models:
  - name: fact_orders
    description: "This is the fact table for orders, which includes order details and summary information"
    columns:
      - name: order_key
        description: "The unique identifier for each order."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_orders')
                field: order_key
              config:
                severity: warn
      - name: status_code
        tests:
          - accepted_values:
              arguments:
                values: ['P', 'O', 'F']